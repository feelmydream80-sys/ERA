{% if total_count == 0 %}
<div class="text-center py-4">
    <p class="text-muted">No friends found on KakaoTalk.</p>
    <p class="small text-muted">Make sure your friends are using the same Kakao service.</p>
    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
</div>
{% else %}
<div class="list-group list-group-flush">
    {% for friend in friends %}
    <button type="button" class="list-group-item list-group-item-action bg-dark text-light border-secondary d-flex align-items-center"
            hx-post="{{ url_for('kakao.share_friend', paper_id=paper_id) }}"
            hx-vals='{"receiver_uuid": "{{ friend.uuid }}"}'
            hx-target="#friendModalBody"
            hx-swap="innerHTML">
        {% if friend.profile_thumbnail_image %}
        <img src="{{ friend.profile_thumbnail_image }}" alt="" class="rounded-circle me-3" width="40" height="40"
             onerror="this.style.display='none'">
        {% endif %}
        <span>{{ friend.profile_nickname }}</span>
    </button>
    {% endfor %}
</div>
{% if total_count > 20 %}
<p class="text-center text-muted small mt-2">Showing 20 of {{ total_count }} friends</p>
{% endif %}
{% endif %}
