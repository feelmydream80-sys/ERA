<!DOCTYPE html>
<html lang="ko" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0d6efd">
    <link rel="manifest" href="/static/manifest.json">
    <link rel="icon" type="image/svg+xml" href="/static/icons/icon.svg">
    <title>{% block title %}Power Papers{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{{ url_for('feed.index') }}">
                ⚡ Power Papers
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('feed.index') }}">Papers</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('logs.index') }}">Crawl Log</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('settings.index') }}">Keywords</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('feed.health') }}">Health</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('feed.about') }}">About</a>
                    </li>
                </ul>
                <form class="d-flex" action="{{ url_for('feed.index') }}" method="GET">
                    <input class="form-control form-control-sm me-2" type="search" name="q" placeholder="Search papers..." value="{{ query or '' }}">
                    <button class="btn btn-outline-light btn-sm" type="submit">Search</button>
                </form>
            </div>
        </div>
    </nav>

    <div class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.4/kakao.min.js" crossorigin="anonymous"></script>
    <script>
    (function() {
        var jsKey = '{{ config.KAKAO_JAVASCRIPT_KEY }}';
        if (jsKey && typeof Kakao !== 'undefined') {
            Kakao.init(jsKey);
        }
    })();

    function sharePaperViaKakao(title, url) {
        if (typeof Kakao === 'undefined' || !Kakao.isInitialized()) {
            alert('Kakao Share is not initialized. Please check your JavaScript key configuration.');
            return;
        }
        var text = '📄 ' + title;
        if (text.length > 200) {
            text = text.substring(0, 197) + '...';
        }
        Kakao.Share.sendDefault({
            objectType: 'text',
            text: text,
            link: {
                webUrl: url,
                mobileWebUrl: url
            },
            buttonTitle: 'View Paper'
        });
    }
    </script>
    <script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/static/sw.js');
    }
    </script>
</body>
</html>
